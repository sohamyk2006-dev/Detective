<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Competition</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PIN ENTRY SCREEN -->
  <div id="pin-screen" class="screen active">
    <div class="container">
      <h1 class="title">🔐 Enter the Code</h1>
      <p class="subtitle">Enter the 4-digit code to proceed</p>

      <div class="pin-display">
        <span class="dot" id="dot-0"></span>
        <span class="dot" id="dot-1"></span>
        <span class="dot" id="dot-2"></span>
        <span class="dot" id="dot-3"></span>
      </div>

      <div id="error-msg" class="error-msg"></div>

      <div class="keypad">
        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
        <button class="key clear-key" data-action="clear">✕</button>
        <button class="key" data-digit="0">0</button>
        <button class="key submit-key" data-action="submit">→</button>
      </div>
    </div>
  </div>

  <!-- SUCCESS SCREEN (hidden by default) -->
  <div id="success-screen" class="screen">
    <div class="container success-container">
      <h1 class="success-title">🎉 Congratulations!</h1>
      <div class="success-text" id="success-text">
        <!-- ====== PUT YOUR SUCCESS TEXT HERE ====== -->
        <p>Your message goes here.</p>
        <!-- ======================================= -->
      </div>
      <button class="back-btn" id="back-btn">← Go Back</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
